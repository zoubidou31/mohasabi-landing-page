# Cloudflare Pages Configuration for Mohasabi Landing Page
# https://github.com/zoubidou31/mohasabi-landing-page

name = "mohasabi-landing-page"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# =============================================================================
# Preview Environment (https://mohasabi-preview.pages.dev/)
# =============================================================================
# Used for staging, manual verification, and QA testing.
# Deploy command: npx wrangler pages deploy dist --project-name=mohasabi-preview
[env.preview]
name = "mohasabi-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "mohasabi-preview-db"
database_id = "preview-db-placeholder"

# =============================================================================
# Production Environment (https://mohasabi.pages.dev/)
# =============================================================================
# SAFEGUARD: Production deployment is strictly separated and requires explicit
# confirmation from the owner. Do not deploy to production directly.
#
# [env.production]
# name = "mohasabi"
# [[env.production.d1_databases]]
# binding = "DB"
# database_name = "mohasabi-prod-db"
# database_id = "prod-db-placeholder"
